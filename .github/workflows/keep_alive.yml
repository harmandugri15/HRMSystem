name: Render Keep Alive Ping

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Render Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://hrms-avog.onrender.com/api/health
