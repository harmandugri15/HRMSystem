<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In // PULSE Enterprise</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <header class="navbar"></header>

  <main class="container" style="max-width: 520px; margin-top: 2rem;">
    
    <div class="card" style="padding: 2.2rem; border-radius: 16px;">
      <div style="text-align: center; margin-bottom: 1.2rem;">
        <img src="/static/assets/svg/auth-abstract-art.svg" alt="Authentication Telemetry" style="width: 220px; height: auto; margin: 0 auto 10px auto; display: block;">
        <span class="badge-tag">ENTERPRISE ACCESS</span>
        <h2 style="font-size: 1.9rem; margin: 8px 0 4px 0;">Sign In to PULSE</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Access your executive dashboard or employee growth hub.</p>
      </div>

      <div id="alert-box" style="display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; margin-bottom: 1rem;"></div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Work Email</label>
          <input type="email" class="form-input" id="login-email" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="login-submit-btn">SIGN IN</button>
      </form>

      <div style="margin-top: 1.8rem; border-top: 1px solid var(--border-color); padding-top: 1.4rem; text-align: center;">
        <div style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 12px;">Don't have an account yet?</div>
        <div style="display: flex; gap: 10px; justify-content: center;">
          <a href="/register-employee" class="btn btn-secondary btn-sm">REGISTER AS EMPLOYEE</a>
          <a href="/register-hr" class="btn btn-secondary btn-sm">START HR TRIAL</a>
        </div>
      </div>

      <div style="margin-top: 1.5rem; background: #F8FAFC; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; text-align: center;">
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Evaluation Quick Launch</div>
        <div style="display: flex; gap: 8px; justify-content: center;">
          <button class="btn btn-secondary btn-sm" onclick="launchQuickDemo('hr')">⚡ Demo HR Account</button>
          <button class="btn btn-secondary btn-sm" onclick="launchQuickDemo('employee')">👤 Demo Employee</button>
        </div>
      </div>

    </div>

  </main>

  <script src="/static/common.js"></script>
  <script>
    renderNavbar('login');

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const alertBox = document.getElementById('alert-box');
      const submitBtn = document.getElementById('login-submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerText = 'AUTHENTICATING...';
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          setCurrentUser(data.user);
          if (data.user.role === 'hr') {
            window.location.href = '/hr/dashboard';
          } else {
            if (!data.user.is_onboarded) {
              window.location.href = '/employee/onboarding';
            } else {
              window.location.href = '/employee/dashboard';
            }
          }
        } else {
          alertBox.style.display = 'block';
          alertBox.style.background = '#FEE2E2';
          alertBox.style.color = '#991B1B';
          alertBox.style.border = '1px solid #F87171';
          alertBox.innerText = data.detail || 'Login failed. Please check your credentials.';
        }
      } catch (err) {
        console.error("Login error:", err);
        alertBox.style.display = 'block';
        alertBox.style.background = '#FEE2E2';
        alertBox.style.color = '#991B1B';
        alertBox.innerText = err.message || 'Login error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'SIGN IN';
      }
    }

    async function launchQuickDemo(role) {
      const email = role === 'hr' ? 'hr@pulse.ai' : 'alex@pulse.ai';
      const pass = role === 'hr' ? 'HR@123' : 'Emp@123';
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
