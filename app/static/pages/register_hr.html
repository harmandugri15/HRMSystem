<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register HR Organization // PULSE HRMS</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <header class="navbar"></header>

  <main class="container" style="max-width: 540px; margin-top: 2rem;">
    
    <div class="card" style="padding: 2.2rem; border-radius: 16px;">
      <div style="text-align: center; margin-bottom: 1.2rem;">
        <img src="/static/assets/svg/auth-abstract-art.svg" alt="HR Registration Telemetry" style="width: 220px; height: auto; margin: 0 auto 10px auto; display: block;">
        <span class="badge-tag">HR EXECUTIVE ONBOARDING</span>
        <h2 style="font-size: 1.9rem; margin: 8px 0 4px 0;">Create HR Organization</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Auto-generates a unique HR Invite Code for your staff.</p>
      </div>

      <div id="alert-box" style="display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; margin-bottom: 1rem;"></div>

      <form id="reg-hr-form" onsubmit="handleHRRegister(event)">
        <div class="form-group">
          <label class="form-label">HR Director / Executive Name</label>
          <input type="text" class="form-input" id="hr-name" placeholder="e.g. Sarah Jenkins" required>
        </div>

        <div class="form-group">
          <label class="form-label">Company / Organization Name</label>
          <input type="text" class="form-input" id="hr-company" placeholder="e.g. Acme Global Technologies" required>
        </div>

        <div class="form-group">
          <label class="form-label">Corporate Email</label>
          <input type="email" class="form-input" id="hr-email" placeholder="sarah@acme.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="hr-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="hr-submit-btn">CREATE HR SUITE & GET HR CODE ➔</button>
      </form>

      <div style="margin-top: 1.8rem; border-top: 1px solid var(--border-color); padding-top: 1.2rem; text-align: center;">
        <div style="font-size: 0.88rem; color: var(--text-secondary);">Already have an account? <a href="/login" style="color: var(--accent-flame); font-weight: 700; text-decoration: none;">Sign in here</a></div>
      </div>
    </div>

  </main>

  <script src="/static/common.js"></script>
  <script>
    renderNavbar('reg_hr');

    async function handleHRRegister(e) {
      e.preventDefault();
      const name = document.getElementById('hr-name').value.trim();
      const company = document.getElementById('hr-company').value.trim();
      const email = document.getElementById('hr-email').value.trim();
      const password = document.getElementById('hr-password').value;
      const alertBox = document.getElementById('alert-box');
      const submitBtn = document.getElementById('hr-submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerText = 'GENERATING HR CODE & OTP...';
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/register-hr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, company, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('pending_verify_email', email);
          sessionStorage.setItem('pending_otp_preview', data.otp_preview || '');
          window.location.href = `/verify-email?email=${encodeURIComponent(email)}&hr_code=${encodeURIComponent(data.hr_code)}`;
        } else {
          alertBox.style.display = 'block';
          alertBox.style.background = '#FEE2E2';
          alertBox.style.color = '#991B1B';
          alertBox.style.border = '1px solid #F87171';
          alertBox.innerText = data.detail || 'Registration failed.';
        }
      } catch(err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#FEE2E2';
        alertBox.style.color = '#991B1B';
        alertBox.innerText = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'CREATE HR SUITE & GET HR CODE ➔';
      }
    }
  </script>
</body>
</html>
