<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Registration // PULSE Enterprise</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <header class="navbar"></header>

  <main class="container" style="max-width: 580px; margin-top: 2rem;">
    
    <div class="card" style="padding: 2.2rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="badge-tag">HR EXECUTIVE ONBOARDING</span>
        <h2 style="font-size: 2rem; margin: 10px 0 6px 0;">Create HR Account</h2>
        <p style="color: var(--text-secondary); font-size: 0.92rem;">
          Get your company HR Code and access full workforce retention diagnostics.
        </p>
      </div>

      <div id="alert-box" style="display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; margin-bottom: 1rem;"></div>

      <form id="hr-reg-form" onsubmit="handleHRRegSubmit(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="hr-name" placeholder="e.g. Sarah Jenkins" required>
        </div>

        <div class="form-group">
          <label class="form-label">Company / Organization Name</label>
          <input type="text" class="form-input" id="hr-company" placeholder="e.g. Acme Global Corp" required>
        </div>

        <div class="form-group">
          <label class="form-label">Work Email</label>
          <input type="email" class="form-input" id="hr-email" placeholder="sarah@acme.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password (min 6 characters)</label>
          <input type="password" class="form-input" id="hr-password" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="hr-reg-btn">CREATE HR ACCOUNT & GENERATE CODE</button>
      </form>

      <div style="margin-top: 1.8rem; border-top: 1px solid var(--border-color); padding-top: 1.4rem; text-align: center;">
        <div style="font-size: 0.88rem; color: var(--text-secondary);">
          Already have an account? <a href="/login" style="color: var(--accent-flame); font-weight: 700; text-decoration: none;">Sign In</a>
        </div>
      </div>

    </div>

  </main>

  <script src="/static/common.js"></script>
  <script>
    renderNavbar('register_hr');

    async function handleHRRegSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('hr-name').value;
      const company = document.getElementById('hr-company').value;
      const email = document.getElementById('hr-email').value;
      const password = document.getElementById('hr-password').value;
      const btn = document.getElementById('hr-reg-btn');
      const alertBox = document.getElementById('alert-box');

      btn.disabled = true;
      btn.innerText = "CREATING ACCOUNT...";
      alertBox.style.display = "none";

      try {
        const res = await fetch('/api/auth/register-hr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, company, email, password })
        });
        const data = await res.json();
        
        if (res.ok && data.success) {
          // Set user in localStorage and redirect to verification
          setCurrentUser({
            name,
            email,
            role: "hr",
            company,
            hr_code: data.hr_code,
            is_verified: false,
            is_onboarded: true
          });
          window.location.href = `/verify-email?email=${encodeURIComponent(email)}&otp_preview=${encodeURIComponent(data.otp_preview || '')}`;
        } else {
          alertBox.style.display = "block";
          alertBox.style.background = "rgba(239, 68, 68, 0.1)";
          alertBox.style.color = "#DC2626";
          alertBox.innerText = data.detail || "Registration failed.";
          btn.disabled = false;
          btn.innerText = "CREATE HR ACCOUNT & GENERATE CODE";
        }
      } catch (err) {
        alertBox.style.display = "block";
        alertBox.style.background = "rgba(239, 68, 68, 0.1)";
        alertBox.style.color = "#DC2626";
        alertBox.innerText = "Network error.";
        btn.disabled = false;
        btn.innerText = "CREATE HR ACCOUNT & GENERATE CODE";
      }
    }
  </script>
</body>
</html>
