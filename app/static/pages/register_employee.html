<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Registration // PULSE Enterprise</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <header class="navbar"></header>

  <main class="container" style="max-width: 540px; margin-top: 2rem;">
    
    <div class="card" style="padding: 2.2rem; border-radius: 16px;">
      <div style="text-align: center; margin-bottom: 1.2rem;">
        <img src="/static/assets/svg/auth-abstract-art.svg" alt="Registration Telemetry" style="width: 220px; height: auto; margin: 0 auto 10px auto; display: block;">
        <span class="badge-tag">EMPLOYEE PORTAL</span>
        <h2 style="font-size: 1.9rem; margin: 8px 0 4px 0;">Join Your Organization</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Register using the unique HR Code provided by your company.</p>
      </div>

      <div id="alert-box" style="display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; margin-bottom: 1rem;"></div>

      <form id="reg-emp-form" onsubmit="handleEmployeeRegister(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="emp-name" placeholder="e.g. Alex Rivera" required>
        </div>

        <div class="form-group">
          <label class="form-label">Work Email</label>
          <input type="email" class="form-input" id="emp-email" placeholder="alex@company.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">HR Invite Code</label>
          <input type="text" class="form-input" id="emp-hrcode" placeholder="e.g. HR-7700-ACME" value="HR-7700-ACME" required style="font-weight: 700; letter-spacing: 0.05em; color: var(--accent-flame);">
          <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; display: block;">Default test code: HR-7700-ACME (Acme Global HR)</small>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="emp-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="emp-submit-btn">CONTINUE TO EMAIL VERIFICATION ➔</button>
      </form>

      <div style="margin-top: 1.8rem; border-top: 1px solid var(--border-color); padding-top: 1.2rem; text-align: center;">
        <div style="font-size: 0.88rem; color: var(--text-secondary);">Already registered? <a href="/login" style="color: var(--accent-flame); font-weight: 700; text-decoration: none;">Sign in here</a></div>
      </div>
    </div>

  </main>

  <script src="/static/common.js"></script>
  <script>
    renderNavbar('reg_emp');

    async function handleEmployeeRegister(e) {
      e.preventDefault();
      const name = document.getElementById('emp-name').value.trim();
      const email = document.getElementById('emp-email').value.trim();
      const hr_code = document.getElementById('emp-hrcode').value.trim();
      const password = document.getElementById('emp-password').value;
      const alertBox = document.getElementById('alert-box');
      const submitBtn = document.getElementById('emp-submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerText = 'CREATING ACCOUNT & SENDING OTP...';
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/register-employee', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, hr_code, password })
        });
        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('pending_verify_email', email);
          sessionStorage.setItem('pending_otp_preview', data.otp_preview || '');
          window.location.href = `/verify-email?email=${encodeURIComponent(email)}`;
        } else {
          alertBox.style.display = 'block';
          alertBox.style.background = '#FEE2E2';
          alertBox.style.color = '#991B1B';
          alertBox.style.border = '1px solid #F87171';
          alertBox.innerText = data.detail || 'Registration failed.';
        }
      } catch(err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#FEE2E2';
        alertBox.style.color = '#991B1B';
        alertBox.innerText = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'CONTINUE TO EMAIL VERIFICATION ➔';
      }
    }
  </script>
</body>
</html>
