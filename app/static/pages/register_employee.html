<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Registration // PULSE Enterprise</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <header class="navbar"></header>

  <main class="container" style="max-width: 580px; margin-top: 2rem;">
    
    <div class="card" style="padding: 2.2rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="badge-tag">EMPLOYEE ONBOARDING</span>
        <h2 style="font-size: 2rem; margin: 10px 0 6px 0;">Create Employee Profile</h2>
        <p style="color: var(--text-secondary); font-size: 0.92rem;">
          Enter the HR Invite Code provided by your company to unlock your career hub.
        </p>
      </div>

      <div id="alert-box" style="display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; margin-bottom: 1rem;"></div>

      <form id="emp-reg-form" onsubmit="handleEmpRegSubmit(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="emp-name" placeholder="e.g. Alex Mercer" required>
        </div>

        <div class="form-group">
          <label class="form-label">Work Email</label>
          <input type="email" class="form-input" id="emp-email" placeholder="alex@acme.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">HR Invite Code (e.g. HR-7700-ACME)</label>
          <input type="text" class="form-input" id="emp-hrcode" placeholder="HR-7700-ACME" value="HR-7700-ACME" required>
          <p style="color: var(--text-muted); font-size: 0.78rem; margin-top: 4px;">Ask your HR Director or Department Lead for your company's onboarding code.</p>
        </div>

        <div class="form-group">
          <label class="form-label">Password (min 6 characters)</label>
          <input type="password" class="form-input" id="emp-password" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="emp-reg-btn">REGISTER & RECEIVE OTP</button>
      </form>

      <div style="margin-top: 1.8rem; border-top: 1px solid var(--border-color); padding-top: 1.4rem; text-align: center;">
        <div style="font-size: 0.88rem; color: var(--text-secondary);">
          Already have an account? <a href="/login" style="color: var(--accent-flame); font-weight: 700; text-decoration: none;">Sign In</a>
        </div>
      </div>

    </div>

  </main>

  <script src="/static/common.js"></script>
  <script>
    renderNavbar('register_employee');

    async function handleEmpRegSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('emp-name').value;
      const email = document.getElementById('emp-email').value;
      const hr_code = document.getElementById('emp-hrcode').value;
      const password = document.getElementById('emp-password').value;
      const btn = document.getElementById('emp-reg-btn');
      const alertBox = document.getElementById('alert-box');

      btn.disabled = true;
      btn.innerText = "REGISTERING...";
      alertBox.style.display = "none";

      try {
        const res = await fetch('/api/auth/register-employee', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, hr_code })
        });
        const data = await res.json();
        
        if (res.ok && data.success) {
          setCurrentUser({
            name,
            email,
            role: "employee",
            hr_code,
            is_verified: false,
            is_onboarded: false
          });
          window.location.href = `/verify-email?email=${encodeURIComponent(email)}&otp_preview=${encodeURIComponent(data.otp_preview || '')}`;
        } else {
          alertBox.style.display = "block";
          alertBox.style.background = "rgba(239, 68, 68, 0.1)";
          alertBox.style.color = "#DC2626";
          alertBox.innerText = data.detail || "Registration failed.";
          btn.disabled = false;
          btn.innerText = "REGISTER & RECEIVE OTP";
        }
      } catch (err) {
        alertBox.style.display = "block";
        alertBox.style.background = "rgba(239, 68, 68, 0.1)";
        alertBox.style.color = "#DC2626";
        alertBox.innerText = "Network error.";
        btn.disabled = false;
        btn.innerText = "REGISTER & RECEIVE OTP";
      }
    }
  </script>
</body>
</html>
