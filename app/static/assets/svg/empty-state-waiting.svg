<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF470A"/>
      <stop offset="100%" stop-color="#FFA41C"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="160" cy="120" r="65" fill="url(#orbGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- Orbital Rings -->
  <ellipse cx="160" cy="120" rx="90" ry="32" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 6" transform="rotate(-15 160 120)"/>
  <ellipse cx="160" cy="120" rx="110" ry="42" stroke="url(#ringGrad)" stroke-width="2" transform="rotate(25 160 120)" opacity="0.6"/>

  <!-- Orbiting Satellites -->
  <circle cx="90" cy="90" r="5" fill="#2563EB"/>
  <circle cx="235" cy="145" r="4" fill="#FF470A"/>
  <circle cx="185" cy="65" r="3" fill="#10B981"/>

  <!-- Center Geometric Beacon / Floating Prism -->
  <g transform="translate(130, 85)">
    <!-- Top Pyramid Face -->
    <polygon points="30,0 60,18 30,36 0,18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="60,18 60,52 30,70 30,36" fill="#FFF7ED" stroke="#FFD8B2" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="0,18 30,36 30,70 0,52" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Glowing Core Center -->
    <circle cx="30" cy="36" r="8" fill="url(#orbGrad)"/>
    <circle cx="30" cy="36" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Subtle Connecting Data Beams -->
  <line x1="160" y1="50" x2="160" y2="75" stroke="#FF470A" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7"/>
  <line x1="160" y1="165" x2="160" y2="190" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7"/>

  <circle cx="160" cy="45" r="2.5" fill="#FF470A"/>
  <circle cx="160" cy="195" r="2.5" fill="#2563EB"/>
</svg>
