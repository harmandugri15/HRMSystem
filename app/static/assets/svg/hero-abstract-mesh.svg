<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF470A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Light Orbs -->
  <circle cx="580" cy="180" r="160" fill="url(#flameGrad)" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="240" cy="380" r="180" fill="url(#blueGrad)" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="480" cy="440" r="140" fill="url(#purpleGrad)" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Background Perspective Grid Lines -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7">
    <line x1="100" y1="100" x2="700" y2="100"/>
    <line x1="100" y1="200" x2="700" y2="200"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="400" x2="700" y2="400"/>
    <line x1="100" y1="500" x2="700" y2="500"/>
    <line x1="200" y1="80" x2="200" y2="520"/>
    <line x1="400" y1="80" x2="400" y2="520"/>
    <line x1="600" y1="80" x2="600" y2="520"/>
  </g>

  <!-- Flowing Spline Waveforms -->
  <path d="M 80,320 C 220,180 340,420 480,260 C 600,120 700,280 760,220" stroke="url(#flameGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 100,380 C 240,260 380,480 520,340 C 640,220 720,360 760,320" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Geometric Isometric Cubes & Nodes -->
  <!-- Top Right Prism -->
  <g transform="translate(560, 100)" filter="url(#cardShadow)">
    <polygon points="50,0 100,28 50,56 0,28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <polygon points="100,28 100,85 50,113 50,56" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <polygon points="0,28 50,56 50,113 0,85" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="50" cy="28" r="7" fill="#FF470A"/>
  </g>

  <!-- Left Center Prism -->
  <g transform="translate(140, 240)" filter="url(#cardShadow)">
    <polygon points="40,0 80,23 40,46 0,23" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <polygon points="80,23 80,70 40,93 40,46" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <polygon points="0,23 40,46 40,93 0,70" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <circle cx="40" cy="23" r="6" fill="#2563EB"/>
  </g>

  <!-- Main Floating Glass Metric Card -->
  <g transform="translate(280, 180)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="170" rx="16" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="6" fill="#FF470A"/>
    <rect x="42" y="24" width="70" height="12" rx="6" fill="#E2E8F0"/>
    
    <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="28" font-weight="800" fill="#0F172A">94.8%</text>
    <text x="24" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" fill="#64748B">RETENTION STABILITY INDEX</text>

    <!-- Mini Trend Sparkline -->
    <path d="M 24,140 L 60,135 L 100,142 L 140,128 L 180,132 L 220,118 L 256,112" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="256" cy="112" r="4" fill="#10B981"/>
  </g>

  <!-- Bottom Right Floating Talent Card -->
  <g transform="translate(460, 360)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="110" rx="14" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="10" fill="#FFEDD5"/>
    <circle cx="24" cy="26" r="5" fill="#FF470A"/>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700" fill="#0F172A">30-60-90 ROADMAP</text>
    <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500" fill="#64748B">AI Skill Calibration</text>

    <rect x="20" y="60" width="180" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="20" y="60" width="144" height="8" rx="4" fill="url(#flameGrad)"/>
    <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#FF470A">80% Competency Match</text>
  </g>

  <!-- Network Interconnection Nodes -->
  <line x1="220" y1="260" x2="280" y2="240" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="560" y1="260" x2="600" y2="185" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="420" y1="350" x2="460" y2="380" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <circle cx="280" cy="240" r="4" fill="#2563EB"/>
  <circle cx="560" cy="260" r="4" fill="#FF470A"/>
</svg>
